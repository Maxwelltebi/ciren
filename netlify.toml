# Build config lives in the repo so it is reproducible and the team can see it,
# rather than being buried in a dashboard.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React Router handles deep links after the SPA entry loads.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite gives built JS/CSS hashed names, so they can be cached for good. Images
# keep their names when replaced, so they get a week before rechecking.
[[headers]]
  for = "/assets/index-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
